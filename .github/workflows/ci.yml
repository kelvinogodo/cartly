name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type-check app
        run: npm run typecheck

      - name: Type-check scripts and API functions
        run: npm run typecheck:scripts

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          # The build itself doesn't talk to Supabase; these only need to be present-looking.
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
